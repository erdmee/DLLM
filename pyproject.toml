[project]
name = "diffusion-llm"
version = "0.1.0"
description = "A minimal block-diffusion LLM: flow matching over continuous token embeddings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "numpy>=1.26",
    "tokenizers>=0.23.3",
    "torch>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffusion_llm"]

[dependency-groups]
dev = [
    "pyrefly>=1.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pyrefly]
project-includes = ["src"]
search-path = ["src"]
ignore-missing-imports = ["**/tests/**"]
